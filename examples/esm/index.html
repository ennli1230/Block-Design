<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlockDesign ESM entegrasyonu</title>
    <link rel="stylesheet" href="../../dist/esm/blockdesign-editor.css" />
    <style>
      html,
      body,
      #editor {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module">
      const host = document.querySelector("#editor");
      try {
        const { mountEditor } = await import(
          "../../dist/esm/blockdesign-editor.js"
        );
        const editor = mountEditor(host, { language: "tr", mode: "content" });
        await editor.ready;
        window.addEventListener(
          "pagehide",
          () => {
            void editor.destroy();
          },
          { once: true },
        );
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        host.textContent = `Editör başlatılamadı: ${message}`;
        host.setAttribute("role", "alert");
      }
    </script>
  </body>
</html>
